<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job | Fixify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --fixify-blue: #1a56a3;
            --fixify-dark: #0d4a8c;
            --fixify-light: #e6f0fa;
        }
        body {
            background-color: #f8fbff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-img {
            width: 110px; /* Smaller size for form-focused page */
            height: auto;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        .brand-title {
            color: var(--fixify-dark);
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .form-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(26, 86, 163, 0.08);
            padding: 2rem;
        }
        .form-label {
            font-weight: 600;
            color: #2c3e50;
        }
        .btn-success {
            background-color: var(--fixify-blue);
            border-color: var(--fixify-dark);
            font-weight: 600;
            padding: 0.75rem 1.5rem;
        }
        .btn-success:hover {
            background-color: var(--fixify-dark);
        }
        .btn-link {
            color: var(--fixify-blue);
            font-weight: 600;
        }
        .btn-link:hover {
            text-decoration: underline;
            color: var(--fixify-dark);
        }
        .form-control:focus {
            border-color: var(--fixify-blue);
            box-shadow: 0 0 0 0.25rem rgba(26, 86, 163, 0.25);
        }
        .category-icon {
            margin-right: 0.5rem;
            width: 18px;
            height: 18px;
            display: inline-block;
        }
        .urgency-high {
            background-color: #ffebee;
            border-color: #ffcdd2;
        }
        .urgency-medium {
            background-color: #fff8e1;
            border-color: #ffecb3;
        }
        .urgency-low {
            background-color: #e8f5e9;
            border-color: #c8e6c9;
        }
        .photo-preview {
            border-radius: 8px;
            width: 100%;
            height: 200px;
            object-fit: cover;
            margin-bottom: 1rem;
            border: 1px solid #e0e7f0;
        }
        .no-photo {
            background: #f0f4f8;
            border-radius: 8px;
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #cbd9ed;
            color: #6c757d;
        }
        .photo-help {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <!-- Logo & Title -->
        <div class="logo-container">
            <img src="{{ url_for('static', filename='images/Fixify.png') }}" 
                 alt="Fixify Logo" 
                 class="logo-img">
            <h1 class="brand-title mt-3">Post a Home Service Job</h1>
            <p class="text-muted">Help is just one click away</p>
        </div>

        <!-- Form Card -->
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="form-card">
                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-4">
                            <label class="form-label">Job Title</label>
                            <input type="text" name="title" class="form-control form-control-lg" placeholder="e.g., Fix leaky faucet" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="4" placeholder="Describe what you need help with..." required></textarea>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Category</label>
                            <select name="category" class="form-select" required>
                                <option value="" disabled selected>Select a service category</option>
                                <option value="Plumbing">💧 Plumbing</option>
                                <option value="Electrical">⚡ Electrical</option>
                                <option value="Cleaning">🧹 Cleaning</option>
                                <option value="Gardening">🌿 Gardening</option>
                                <option value="Painting">🎨 Painting</option>
                                <option value="HVAC">❄️ HVAC</option>
                                <option value="Carpentry">🪵 Carpentry</option>
                                <option value="Other">🔧 Other</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Urgency Level</label>
                            <div class="d-grid gap-2">
                                <div class="form-check p-3 border rounded">
                                    <input class="form-check-input" type="radio" name="urgency" id="urgencyHigh" value="High" required>
                                    <label class="form-check-label d-flex justify-content-between w-100" for="urgencyHigh">
                                        <span><i class="bi bi-exclamation-circle-fill text-danger me-2"></i> High Urgency</span>
                                        <small class="text-muted">Immediate attention needed</small>
                                    </label>
                                </div>
                                
                                <div class="form-check p-3 border rounded">
                                    <input class="form-check-input" type="radio" name="urgency" id="urgencyMedium" value="Medium" required>
                                    <label class="form-check-label d-flex justify-content-between w-100" for="urgencyMedium">
                                        <span><i class="bi bi-exclamation-triangle-fill text-warning me-2"></i> Medium Urgency</span>
                                        <small class="text-muted">Within 2-3 days</small>
                                    </label>
                                </div>
                                
                                <div class="form-check p-3 border rounded">
                                    <input class="form-check-input" type="radio" name="urgency" id="urgencyLow" value="Low" required>
                                    <label class="form-check-label d-flex justify-content-between w-100" for="urgencyLow">
                                        <span><i class="bi bi-check-circle-fill text-success me-2"></i> Low Urgency</span>
                                        <small class="text-muted">Within a week</small>
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Preferred Timing</label>
                            <select name="timing_window" class="form-select" required>
                                <option value="" disabled selected>Select your preferred timing</option>
                                <option value="Morning (8am-12pm)">🌅 Morning (8am-12pm)</option>
                                <option value="Afternoon (12pm-5pm)">🌇 Afternoon (12pm-5pm)</option>
                                <option value="Evening (5pm-9pm)">🌃 Evening (5pm-9pm)</option>
                                <option value="Flexible">🔄 Flexible - I can adjust</option>
                                <option value="Weekend Only">📅 Weekend Only</option>
                            </select>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Photo (Optional)</label>
                            <div class="mb-2">
                                <div class="no-photo" id="photo-preview">
                                    <i class="bi bi-camera me-2"></i>
                                    No photo selected
                                </div>
                            </div>
                            <input type="file" name="photo" class="form-control" accept="image/*" 
                                   onchange="previewPhoto(this)">
                            <div class="photo-help">
                                <i class="bi bi-info-circle me-1"></i> 
                                Upload a photo showing the issue (max 16MB)
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Location</label>
                            <input type="text" name="location" class="form-control" placeholder="e.g., Brooklyn, NY" required>
                        </div>

                        <div class="d-grid gap-3">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="bi bi-check-circle-fill me-2"></i>Post Job
                            </button>
                            <a href="/" class="btn btn-link text-center">← Back to Jobs</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function previewPhoto(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                
                reader.onload = function(e) {
                    var preview = document.getElementById('photo-preview');
                    preview.innerHTML = '<img src="' + e.target.result + '" class="photo-preview" alt="Preview">';
                }
                
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
